version: 2.1

executors:
  ruby:
    parameters:
      version:
        type: string
    resource_class: small
    docker:
      - image: cimg/ruby:<< parameters.version >>
        environment:
          BUNDLE_VERSION: "4.0.23"
      - image: mysql:5.7
        command: ["--sql-mode="]
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: true

# yaml anchor filters
master_only: &master_only
  filters:
    branches:
      only: master
    tags:
      ignore: /.*/
pr_only: &pr_only
  filters:
    branches:
      ignore: master
    tags:
      ignore: /.*/
version_tags_only: &version_tags_only
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^v.*/

jobs:
  build:
    parameters:
      ruby_version:
        type: string
    executor:
      name: ruby
      version: << parameters.ruby_version >>
    steps:
      - checkout
      - run:
          name: Install MySQL client libraries
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev default-mysql-client netcat-openbsd
      - run:
          name: Install Bundler specific version
          command: |
            gem install bundler --version "${BUNDLE_VERSION}" --force
            bundle config set --local path 'vendor/bundle'
            bundle config set --local frozen 'true'
            bundle config set --local jobs '4'
            bundle config set --local retry '3'
      - run:
          name: Install Ruby Dependencies
          command: bundle install --local --frozen --path=vendor/bundle --jobs=4 --retry=3
      - run:
          name: Load mysql database from workspace
          command: |
            until nc -z 127.0.0.1 3306; do
            echo 'Waiting for MySQL container...'
              sleep 1
            done
            echo 'MySQL container is up'
      - run:
          name: Run Tests
          command: bundle exec rake ci:specs
          environment:
            DATABASE_URL: mysql2://127.0.0.1:3306
      - store_test_results:
          name: Store test results
          path: tmp/test-results
      - run:
          name: Run Rubocop
          command: bundle exec rake ci:rubocop
      - run:
          name: Build documentation
          command: bundle exec rake ci:doc
      - store_artifacts:
          name: Saves documentation
          path: doc
      - persist_to_workspace:
          root: .
          paths:
            - vendor/bundle

workflows:
  version: 2

  trunk:
    jobs:
      - build:
          <<: *master_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]

  pull-requests:
    jobs:
      - build:
          <<: *pr_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]

  final-release:
    jobs:
      - build:
          <<: *version_tags_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]
